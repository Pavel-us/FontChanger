[package]
name = "font-changer"
version = "1.0.0"
description = "Batch font and font size changer for Word, Excel, PowerPoint, LibreOffice, RTF and HTML/CSS files"
license = "MIT"
repository = "https://github.com/Pavel-us/FontChanger"
readme = "../README.md"
keywords = ["font", "batch", "docx", "tauri", "typography"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
walkdir = "2"
rayon = "1"
encoding_rs = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
